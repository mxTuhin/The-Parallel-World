[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffe-pipeline"
version = "0.1.0"
description = "Data pipeline for the open fire-following-earthquake (FFE) model: fetch open data per zone, build building fire graphs, export to Unity."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "h5py>=3.10",
    "fsspec>=2024.2",
    "aiohttp>=3.9",
    "requests>=2.31",
    "pyyaml>=6.0",
    "numba>=0.60",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ffe = "ffe.cli:main"

[tool.setuptools.packages.find]
include = ["ffe*"]

[tool.setuptools.package-data]
ffe = ["zones.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test needs internet access (skipped unless FFE_NETWORK_TESTS=1)"]
